backend:
  name: github
  repo: ShijkaCode/azzoro-resources
  branch: main
  base_url: https://azzoro-resources.vercel.app
  auth_endpoint: api/auth

media_folder: public/uploads
public_folder: /uploads
logo_url: /new_logo.png
site_url: https://azzororesources.com
display_url: https://azzororesources.com

i18n:
  structure: multiple_files
  locales: [en, mn]
  default_locale: en

collections:
  - name: pages
    label: Pages
    i18n: true
    files:
      - name: home
        label: Home
        file: content/pages/home.{{locale}}.md
        i18n: true
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Video ID, name: video_id, widget: string, required: false }
              - { label: Location label (above headline), name: kicker, widget: string, required: false }
              - { label: Headline, name: headline, widget: string }
              - { label: Subline, name: subline, widget: text, required: false }
              - { label: CTA Label, name: cta_label, widget: string }
              - { label: CTA Href, name: cta_href, widget: string }
              - { label: ASX company page URL (hero price tile), name: asx_url, widget: string, required: false }
              - { label: Latest announcements URL (hero tile), name: announcements_url, widget: string, required: false }
              - { label: Corporate presentation URL (hero tile), name: presentation_url, widget: string, required: false }
          - label: Metrics
            name: metrics
            widget: list
            fields:
              - { label: Value, name: value, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Source, name: source, widget: string, required: false }
          - label: Why Mongolia
            name: why_mongolia
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Headline, name: headline, widget: string }
              - { label: Intro, name: intro, widget: text }
              - { label: Footnote, name: footnote, widget: text, required: false }
              - label: Cards
                name: cards
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
                  - { label: Image, name: image, widget: image, required: false }
                  - { label: Image alt text, name: image_alt, widget: string, required: false }
          - label: Why Azzoro
            name: why_azzoro
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Headline, name: headline, widget: string }
              - { label: Banner image, name: image, widget: image, required: false }
              - { label: Banner image alt text, name: image_alt, widget: string, required: false }
              - { label: Intro, name: intro, widget: text }
              - { label: Footnote, name: footnote, widget: text, required: false }
              - label: Cards
                name: cards
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
                  - { label: Tag, name: tag, widget: string, required: false }
          - label: Sustainability teaser
            name: sustainability_teaser
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Body, name: body, widget: text }
              - { label: Image, name: image, widget: image, required: false }
              - { label: CTA label, name: cta_label, widget: string }
              - { label: CTA href, name: cta_href, widget: string }
          - label: Home sustainability cards
            name: home_sustainability
            widget: object
            required: false
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - label: Cards
                name: cards
                widget: list
                fields:
                  - { label: Tag, name: tag, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Body, name: body, widget: text }
                  - { label: Image, name: image, widget: image, required: false }
                  - { label: Image alt text, name: image_alt, widget: string, required: false }
          - label: Leadership teaser
            name: leadership_teaser
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Body, name: body, widget: text }
              - { label: CTA label, name: cta_label, widget: string }
              - { label: CTA href, name: cta_href, widget: string }
          - label: Featured projects (home highlights)
            name: featured_projects
            widget: list
            required: false
            hint: Project highlights shown near the top of the home page. They alternate left / right automatically. Use 3 thumbnails per project.
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Headline, name: headline, widget: string }
              - { label: Lead paragraph, name: lead, widget: text }
              - { label: Main image, name: image, widget: image }
              - { label: Main image alt text, name: image_alt, widget: string, required: false }
              - label: Stats
                name: stats
                widget: list
                fields:
                  - { label: Value, name: value, widget: string }
                  - { label: Label, name: label, widget: string }
              - label: Thumbnails
                name: thumbnails
                widget: list
                fields:
                  - { label: Image, name: image, widget: image }
                  - { label: Caption, name: caption, widget: string, required: false }
                  - { label: Alt text, name: alt, widget: string, required: false }
              - { label: CTA label, name: cta_label, widget: string }
              - { label: CTA link, name: cta_href, widget: string }
              - { label: Footnote, name: footnote, widget: text, required: false }
          - label: Investor snapshot
            name: investor_snapshot
            widget: object
            required: false
            hint: Share price, change and market cap come from the ASX automatically. The figures below are typed in manually and updated after each announcement.
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Headline, name: headline, widget: string }
              - label: Figures (manual)
                name: kpis
                widget: list
                fields:
                  - { label: Value, name: value, widget: string }
                  - { label: Label, name: label, widget: string }
              - { label: Footnote, name: footnote, widget: text }
          - { label: Show news section, name: news_section_enabled, widget: boolean, default: true, required: false }
          - { label: Show stock section, name: stock_section_enabled, widget: boolean, default: true, required: false }
      - name: about
        label: About
        file: content/pages/about.{{locale}}.md
        i18n: true
        fields:
          - { label: Hero image, name: hero_image, widget: image, required: false }
          - { label: Story body, name: story_body, widget: text }
          - { label: Mission, name: mission, widget: text }
          - label: Values
            name: values
            widget: list
            fields:
              - { label: Icon, name: icon, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
          - { label: Leadership & governance body, name: leadership_governance_body, widget: text }
          - { label: Governance documents intro, name: governance_documents_intro, widget: text, required: false }
      - name: esg
        label: ESG
        file: content/pages/esg.{{locale}}.md
        i18n: true
        fields:
          - { label: Hero image, name: hero_image, widget: image, required: false }
          - { label: Hero headline, name: hero_headline, widget: string, required: false }
          - { label: Approach body, name: approach_body, widget: text }
          - label: Environment
            name: environment
            widget: object
            fields:
              - { label: Body, name: body, widget: text }
              - { label: Image, name: image, widget: image, required: false }
          - label: Community
            name: community
            widget: object
            fields:
              - { label: Body, name: body, widget: text }
              - { label: Image, name: image, widget: image, required: false }
          - label: Governance
            name: governance
            widget: object
            required: false
            fields:
              - { label: Body, name: body, widget: text }
              - { label: Image, name: image, widget: image, required: false }
          - { label: Reports intro, name: reports_intro, widget: text }
          - label: Gallery
            name: gallery
            widget: list
            required: false
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Caption, name: caption, widget: string, required: false }
      - name: gallery
        label: Gallery
        file: content/pages/gallery.{{locale}}.md
        i18n: true
        fields:
          - { label: Intro heading, name: intro_heading, widget: string }
          - { label: Intro body, name: intro_body, widget: text }
          - label: Filter tags
            name: filter_tags
            widget: list
            fields:
              - { label: Slug, name: slug, widget: string }
              - { label: Label, name: label, widget: string }
      - name: contact
        label: Contact
        file: content/pages/contact.{{locale}}.md
        i18n: true
        fields:
          - { label: Intro body, name: intro_body, widget: text }
          - label: Offices
            name: offices
            widget: list
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Address, name: address, widget: text }
              - { label: Email, name: email, widget: string, required: false }
              - { label: Hours, name: hours, widget: string, required: false }
              - { label: Photo, name: image, widget: image, required: false }
              - { label: Latitude, name: lat, widget: number, required: false, value_type: float }
              - { label: Longitude, name: lng, widget: number, required: false, value_type: float }
          - label: Phone groups
            name: phone_groups
            widget: list
            fields:
              - { label: Category, name: category, widget: string }
              - label: Numbers
                name: numbers
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Number, name: number, widget: string }
          - { label: General email, name: general_email, widget: string }
  - name: team
    label: Team
    folder: content/team
    create: true
    i18n: true
    slug: '{{slug}}'
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Role, name: role, widget: string }
      - { label: Team section, name: team_section, widget: select, options: [Board, Technical] }
      - { label: Photo, name: photo, widget: image, required: false }
      - { label: Home credential (short line on the home leadership grid), name: home_credential, widget: text, required: false }
      - { label: Bio, name: bio, widget: text }
      - { label: Order, name: order, widget: number, value_type: int }
  - name: governance
    label: Governance
    folder: content/governance
    create: true
    i18n: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Category, name: category, widget: select, options: [Constitution, Charters, Policies, Reports, Disclosures] }
      - { label: File, name: file, widget: file }
      - { label: Effective date, name: effective_date, widget: datetime, format: 'YYYY-MM-DD', time_format: false, date_format: 'YYYY-MM-DD' }
      - { label: Description, name: description, widget: text, required: false }
  - name: projects
    label: Projects
    folder: content/projects
    create: true
    i18n: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Order (lower = higher up the projects list), name: order, widget: number, required: false, value_type: int }
      - { label: Commodity, name: commodity, widget: list }
      - { label: Status, name: status, widget: select, options: [Active exploration, Drilling, Resource definition, Paused] }
      - { label: Region, name: region, widget: string }
      - { label: Latitude, name: lat, widget: number }
      - { label: Longitude, name: lng, widget: number }
      - { label: License area (km2), name: license_area_km2, widget: number, required: false, value_type: int }
      - { label: Acquired date, name: acquired_date, widget: datetime, required: false, format: 'YYYY-MM-DD', time_format: false, date_format: 'YYYY-MM-DD' }
      - { label: Hero image, name: hero_image, widget: image }
      - { label: Gallery images, name: gallery_images, widget: list, required: false, field: { label: Image, name: image, widget: image } }
      - { label: Summary, name: summary, widget: text }
      - { label: Tagline, name: tagline, widget: string, required: false }
      - { label: Flagship, name: is_flagship, widget: boolean, required: false, default: false }
      - { label: Draft (pending Competent Person sign-off), name: is_draft, widget: boolean, required: false, default: false }
      - { label: Parent project slug, name: parent_project, widget: string, required: false }
      - label: Tenure
        name: tenure
        widget: object
        required: false
        fields:
          - { label: Licence, name: licence, widget: string, required: false }
          - { label: Licence type, name: licence_type, widget: string, required: false }
          - { label: Area (km2), name: area_km2, widget: number, required: false, value_type: float }
          - { label: Ownership, name: ownership, widget: string, required: false }
          - { label: Province, name: province, widget: string, required: false }
      - label: Drill highlights
        name: drill_highlights
        widget: list
        required: false
        fields:
          - { label: Drillhole, name: hole, widget: string }
          - { label: Intercept, name: intercept, widget: text }
      - label: Resource table
        name: resource_table
        widget: object
        required: false
        fields:
          - { label: Note, name: note, widget: string, required: false }
          - label: Rows
            name: rows
            widget: list
            fields:
              - { label: Category, name: category, widget: string }
              - { label: Tonnes, name: tonnes, widget: string }
              - { label: Grade, name: grade, widget: string }
              - { label: Contained, name: contained, widget: string }
      - label: Exploration target
        name: exploration_target
        widget: object
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Statement, name: statement, widget: text }
          - { label: Cautionary statement, name: cautionary, widget: text }
      - label: Historical estimate
        name: historical_estimate
        widget: object
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Statement, name: statement, widget: text }
          - { label: Cautionary statement, name: cautionary, widget: text }
      - label: Data cards
        name: data_cards
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Value, name: value, widget: string }
      - label: Documents
        name: documents
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - { label: File, name: file, widget: file }
      - { label: Body, name: body, widget: markdown }
  - name: gallery_photos
    label: Gallery Photos
    folder: content/gallery/photos
    create: true
    i18n: true
    slug: '{{slug}}'
    fields:
      - { label: Image, name: image, widget: image }
      - { label: Caption, name: caption, widget: string, required: false }
      - { label: Tags, name: tags, widget: list }
      - { label: Date, name: date, widget: datetime, format: 'YYYY-MM-DD', time_format: false, date_format: 'YYYY-MM-DD' }
      - { label: Featured, name: featured, widget: boolean, required: false, default: false }
  - name: gallery_videos
    label: Gallery Videos
    folder: content/gallery/videos
    create: true
    i18n: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Stream UID, name: stream_uid, widget: string }
      - { label: Thumbnail, name: thumbnail, widget: image, required: false }
      - { label: Tags, name: tags, widget: list }
      - { label: Date, name: date, widget: datetime, format: 'YYYY-MM-DD', time_format: false, date_format: 'YYYY-MM-DD' }
  - name: case_studies
    label: Case Studies
    folder: content/gallery/case-studies
    create: true
    i18n: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text }
      - { label: Hero image, name: hero_image, widget: image }
      - { label: Date, name: date, widget: datetime, format: 'YYYY-MM-DD', time_format: false, date_format: 'YYYY-MM-DD' }
      - { label: Pull quote, name: pull_quote, widget: text, required: false }
      - { label: Related slugs, name: related, widget: list, required: false }
      - { label: Body, name: body, widget: markdown }
  - name: partners
    label: Partners
    folder: content/partners
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Logo, name: logo, widget: image, required: false }
      - { label: URL, name: url, widget: string, required: false }
      - { label: Order, name: order, widget: number, value_type: int }
  - name: settings
    label: Settings
    i18n: true
    files:
      - name: site
        label: Site
        file: content/settings/site.yml
        fields:
          - { label: Brand name, name: brand_name, widget: string }
          - { label: Logo, name: logo, widget: image, required: false }
          - { label: Dark logo, name: logo_dark, widget: image, required: false }
          - { label: Stock ticker, name: stock_ticker, widget: string }
          - { label: Enable stock API, name: stock_api_enabled, widget: boolean, required: false, default: true }
          - { label: Investor portal URL, name: investor_portal_url, widget: string }
          - label: Social links
            name: social
            widget: object
            required: false
            fields:
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
              - { label: X, name: x, widget: string, required: false }
          - { label: Default locale, name: default_locale, widget: select, options: [en, mn] }
      - name: nav
        label: Navigation
        file: content/settings/nav.{{locale}}.yml
        i18n: true
        fields:
          - label: Items
            name: items
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Href, name: href, widget: string }
              - { label: External, name: external, widget: boolean, required: false }
          - label: Investor dropdown links
            name: investor_links
            widget: list
            required: false
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Href, name: href, widget: string }
      - name: footer
        label: Footer
        file: content/settings/footer.{{locale}}.yml
        i18n: true
        fields:
          - { label: Tagline, name: tagline, widget: text }
          - label: Link columns
            name: link_columns
            widget: list
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Links
                name: links
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Href, name: href, widget: string }
                  - { label: External, name: external, widget: boolean, required: false }
          - { label: Copyright holder, name: copyright_holder, widget: string }
          - label: Legal links
            name: legal_links
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Href, name: href, widget: string }
              - { label: External, name: external, widget: boolean, required: false }