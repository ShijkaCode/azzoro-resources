backend:
  name: github
  repo: ShijkaCode/azzoro-resources
  branch: main
  base_url: https://azzoro-resources.vercel.app
  auth_endpoint: api/auth

media_folder: public/uploads
public_folder: /uploads
logo_url: /brand/logo-on-light.svg
site_url: https://azzuroresources.com
display_url: https://azzuroresources.com

i18n:
  structure: multiple_files
  locales: [ en, mn ]
  default_locale: en

collections:
  - name: pages
    label: Pages
    i18n: true
    files:
      - name: home
        label: Home
        file: content/pages/home.{{locale}}.md
        i18n: true
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Video ID, name: video_id, widget: string, required: false, i18n: true }
              - { label: Location label (above headline), name: kicker, widget: string, required: false, i18n: true }
              - { label: Headline, name: headline, widget: string, i18n: true }
              - { label: Subline, name: subline, widget: text, required: false, i18n: true }
              - { label: CTA Label, name: cta_label, widget: string, i18n: true }
              - { label: CTA Href, name: cta_href, widget: string, i18n: true }
              - { label: ASX company page URL (hero price tile), name: asx_url, widget: string, required: false, i18n: true }
              - { label: Latest announcements URL (hero tile), name: announcements_url, widget: string, required: false, i18n: true }
              - { label: Corporate presentation URL (hero tile), name: presentation_url, widget: string, required: false, i18n: true }
            i18n: true
          - label: Featured projects (home highlights)
            name: featured_projects
            widget: list
            required: false
            hint: Project highlights shown near the top of the home page. They alternate left / right automatically. Use 3 thumbnails per project.
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false, i18n: true }
              - { label: Headline, name: headline, widget: string, i18n: true }
              - { label: Lead paragraph, name: lead, widget: text, i18n: true }
              - { label: Main image, name: image, widget: image, i18n: duplicate }
              - { label: Main image alt text, name: image_alt, widget: string, required: false, i18n: true }
              - label: Stats
                name: stats
                widget: list
                fields:
                  - { label: Value, name: value, widget: string, i18n: true }
                  - { label: Label, name: label, widget: string, i18n: true }
                i18n: true
              - label: Thumbnails
                name: thumbnails
                widget: list
                fields:
                  - { label: Image, name: image, widget: image, i18n: duplicate }
                  - { label: Caption, name: caption, widget: string, required: false, i18n: true }
                  - { label: Alt text, name: alt, widget: string, required: false, i18n: true }
                i18n: true
              - { label: CTA label, name: cta_label, widget: string, i18n: true }
              - { label: CTA link, name: cta_href, widget: string, i18n: true }
              - { label: Footnote, name: footnote, widget: text, required: false, i18n: true }
            i18n: true
          - label: Why Mongolia
            name: why_mongolia
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, i18n: true }
              - { label: Headline, name: headline, widget: string, i18n: true }
              - { label: Banner image, name: image, widget: image, required: false, i18n: duplicate }
              - { label: Banner image alt text, name: image_alt, widget: string, required: false, i18n: true }
              - { label: Intro, name: intro, widget: text, i18n: true }
              - { label: Footnote, name: footnote, widget: text, required: false, i18n: true }
              - label: Cards
                name: cards
                widget: list
                fields:
                  - { label: Title, name: title, widget: string, i18n: true }
                  - { label: Body, name: body, widget: text, i18n: true }
                  - { label: Tag, name: tag, widget: string, required: false, i18n: true }
                i18n: true
            i18n: true
          - label: Why Azzuro
            name: why_azzuro
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, i18n: true }
              - { label: Headline, name: headline, widget: string, i18n: true }
              - { label: Intro, name: intro, widget: text, i18n: true }
              - { label: Footnote, name: footnote, widget: text, required: false, i18n: true }
              - label: Cards
                name: cards
                widget: list
                fields:
                  - { label: Title, name: title, widget: string, i18n: true }
                  - { label: Body, name: body, widget: text, i18n: true }
                  - { label: Image, name: image, widget: image, required: false, i18n: duplicate }
                  - { label: Image alt text, name: image_alt, widget: string, required: false, i18n: true }
                i18n: true
            i18n: true
          - label: Sustainability teaser
            name: sustainability_teaser
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, i18n: true }
              - { label: Body, name: body, widget: text, i18n: true }
              - { label: Image, name: image, widget: image, required: false, i18n: duplicate }
              - { label: CTA label, name: cta_label, widget: string, i18n: true }
              - { label: CTA href, name: cta_href, widget: string, i18n: true }
            i18n: true
          - label: Home sustainability cards
            name: home_sustainability
            widget: object
            required: false
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, i18n: true }
              - label: Cards
                name: cards
                widget: list
                fields:
                  - { label: Tag, name: tag, widget: string, i18n: true }
                  - { label: Title, name: title, widget: string, i18n: true }
                  - { label: Body, name: body, widget: text, i18n: true }
                  - { label: Image, name: image, widget: image, required: false, i18n: duplicate }
                  - { label: Image alt text, name: image_alt, widget: string, required: false, i18n: true }
                i18n: true
            i18n: true
          - label: Investor snapshot
            name: investor_snapshot
            widget: object
            required: false
            hint: Share price, change and market cap come from the ASX automatically. The figures below are typed in manually and updated after each announcement.
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, i18n: true }
              - { label: Headline, name: headline, widget: string, i18n: true }
              - label: Figures (manual)
                name: kpis
                widget: list
                fields:
                  - { label: Value, name: value, widget: string, i18n: true }
                  - { label: Label, name: label, widget: string, i18n: true }
                i18n: true
              - { label: Footnote, name: footnote, widget: text, i18n: true }
            i18n: true
          - label: Leadership teaser
            name: leadership_teaser
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string, i18n: true }
              - { label: Body, name: body, widget: text, i18n: true }
              - { label: CTA label, name: cta_label, widget: string, i18n: true }
              - { label: CTA href, name: cta_href, widget: string, i18n: true }
            i18n: true
          - { label: Show stock section, name: stock_section_enabled, widget: boolean, default: true, required: false, i18n: true }
          - { label: Show news section, name: news_section_enabled, widget: boolean, default: true, required: false, i18n: true }
          - label: Metrics (not shown on the page — legacy field)
            name: metrics
            widget: list
            required: false
            fields:
              - { label: Value, name: value, widget: string, i18n: true }
              - { label: Label, name: label, widget: string, i18n: true }
              - { label: Source, name: source, widget: string, required: false, i18n: true }
            i18n: true
      - name: about
        label: About
        file: content/pages/about.{{locale}}.md
        i18n: true
        fields:
          - { label: Hero image, name: hero_image, widget: image, required: false, i18n: duplicate }
          - { label: Story body, name: story_body, widget: text, i18n: true }
          - { label: Mission, name: mission, widget: text, i18n: true }
          - label: Values
            name: values
            widget: list
            fields:
              - { label: Icon, name: icon, widget: string, required: false, i18n: true }
              - { label: Title, name: title, widget: string, i18n: true }
              - { label: Body, name: body, widget: text, i18n: true }
            i18n: true
          - { label: Leadership & governance body, name: leadership_governance_body, widget: text, i18n: true }
          - { label: Governance documents intro, name: governance_documents_intro, widget: text, required: false, i18n: true }
      - name: projects_page
        label: Projects page (intro)
        file: content/pages/projects.{{locale}}.md
        i18n: true
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string, i18n: true }
          - { label: Title, name: title, widget: string, i18n: true }
          - { label: Intro, name: intro, widget: text, i18n: true }
      - name: esg
        label: ESG
        file: content/pages/esg.{{locale}}.md
        i18n: true
        fields:
          - { label: Hero image, name: hero_image, widget: image, required: false, i18n: duplicate }
          - { label: Hero headline, name: hero_headline, widget: string, required: false, i18n: true }
          - { label: Hero subline, name: hero_subline, widget: text, required: false, i18n: true }
          - label: Metrics (animated stat strip)
            name: metrics
            widget: list
            required: false
            hint: The big numbers near the top of the page. They count up as the visitor scrolls. Keep 4 for the cleanest layout.
            fields:
              - { label: Value, name: value, widget: string, hint: "e.g. 90%, 180+, 30, 2,300 — the leading number animates", i18n: true }
              - { label: Label, name: label, widget: string, i18n: true }
              - { label: Detail (small line under the label), name: detail, widget: string, required: false, i18n: true }
            i18n: true
          - { label: Approach body, name: approach_body, widget: text, i18n: true }
          - label: Approach principles
            name: principles
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string, i18n: true }
              - { label: Body, name: body, widget: text, i18n: true }
            i18n: true
          - label: Commitments (standards we hold ourselves to)
            name: commitments
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string, i18n: true }
              - { label: Body, name: body, widget: text, i18n: true }
            i18n: true
          - label: Engagement steps (how we engage)
            name: engagement_steps
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string, i18n: true }
              - { label: Body, name: body, widget: text, i18n: true }
            i18n: true
          - label: Environment
            name: environment
            widget: object
            fields:
              - { label: Lead body, name: body, widget: text, i18n: true }
              - { label: Image, name: image, widget: image, required: false, i18n: duplicate }
              - label: Topics (water, biodiversity, air, …)
                name: topics
                widget: list
                required: false
                fields:
                  - { label: Topic, name: topic, widget: string, i18n: true }
                  - { label: Body, name: body, widget: text, i18n: true }
                i18n: true
            i18n: true
          - label: Stakeholder engagement (intro for SRA + stories)
            name: community
            widget: object
            fields:
              - { label: Body, name: body, widget: text, i18n: true }
              - { label: Image, name: image, widget: image, required: false, i18n: duplicate }
            i18n: true
          - label: SRA by location
            name: sra_locations
            widget: list
            required: false
            fields:
              - { label: Location, name: location, widget: string, i18n: true }
              - { label: Region (small tag), name: region, widget: string, required: false, i18n: true }
              - { label: Items, name: items, widget: list, i18n: true }
            i18n: true
          - label: Local investment
            name: investment
            widget: object
            required: false
            fields:
              - { label: Intro body, name: body, widget: text, i18n: true }
              - label: Categories
                name: categories
                widget: list
                fields:
                  - { label: Category, name: category, widget: string, i18n: true }
                  - { label: Title, name: title, widget: string, i18n: true }
                  - { label: Body, name: body, widget: text, i18n: true }
                  - { label: Image, name: image, widget: image, required: false, i18n: duplicate }
                i18n: true
            i18n: true
          - { label: Community stories intro, name: stories_intro, widget: text, required: false, i18n: true }
          - label: Community stories
            name: stories
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string, i18n: true }
              - { label: Body, name: body, widget: text, i18n: true }
              - { label: Author, name: author, widget: string, i18n: true }
              - { label: Role, name: role, widget: string, i18n: true }
              - { label: Image, name: image, widget: image, required: false, i18n: duplicate }
            i18n: true
          - { label: Reports intro, name: reports_intro, widget: text, i18n: true }
          - label: Gallery
            name: gallery
            widget: list
            required: false
            fields:
              - { label: Image, name: image, widget: image, i18n: duplicate }
              - { label: Caption, name: caption, widget: string, required: false, i18n: true }
            i18n: true
      - name: gallery
        label: Gallery
        file: content/pages/gallery.{{locale}}.md
        i18n: true
        fields:
          - { label: Intro heading, name: intro_heading, widget: string, i18n: true }
          - { label: Intro body, name: intro_body, widget: text, i18n: true }
          - label: Photo groups
            name: photo_groups
            widget: list
            required: false
            label_singular: Photo group
            summary: '{{fields.tag}}'
            hint: Each group becomes a filter button on the gallery. Drag & drop multiple images into a group at once.
            fields:
              - { label: Tag (filter button label), name: tag, widget: string, i18n: true }
              - { label: Images (drag & drop multiple), name: images, widget: image, multiple: true, required: false, i18n: duplicate }
            i18n: true
      - name: contact
        label: Contact
        file: content/pages/contact.{{locale}}.md
        i18n: true
        fields:
          - { label: Intro body, name: intro_body, widget: text, i18n: true }
          - label: Offices
            name: offices
            widget: list
            fields:
              - { label: Name, name: name, widget: string, i18n: true }
              - { label: Address, name: address, widget: text, i18n: true }
              - { label: Email, name: email, widget: string, required: false, i18n: true }
              - { label: Hours, name: hours, widget: string, required: false, i18n: true }
              - { label: Photo, name: image, widget: image, required: false, i18n: duplicate }
              - { label: Latitude, name: lat, widget: number, required: false, value_type: float, i18n: true }
              - { label: Longitude, name: lng, widget: number, required: false, value_type: float, i18n: true }
            i18n: true
          - label: Phone groups
            name: phone_groups
            widget: list
            fields:
              - { label: Category, name: category, widget: string, i18n: true }
              - label: Numbers
                name: numbers
                widget: list
                fields:
                  - { label: Label, name: label, widget: string, i18n: true }
                  - { label: Number, name: number, widget: string, i18n: true }
                i18n: true
            i18n: true
          - label: Investor Relations contacts
            name: investor_contacts
            widget: list
            required: false
            hint: Named contacts shown as cards in the Investor Relations section of the contact page.
            fields:
              - { label: Name, name: name, widget: string, i18n: true }
              - { label: Role, name: role, widget: string, i18n: true }
              - { label: Email, name: email, widget: string, required: false, i18n: true }
              - { label: Phone numbers, name: phones, widget: list, required: false, i18n: true }
            i18n: true
          - { label: General email, name: general_email, widget: string, i18n: true }
      - name: investor_communication
        label: Investor Communication
        file: content/pages/investor-communication.{{locale}}.md
        i18n: true
        fields:
          - { label: Eyebrow, name: eyebrow, widget: string, i18n: true }
          - { label: Headline, name: headline, widget: string, i18n: true }
          - { label: Intro body, name: intro, widget: text, required: false, i18n: true }
          - { label: Listing heading, name: listing_heading, widget: string, i18n: true }
          - { label: Listing statements (one paragraph each), name: listing_statements, widget: list, i18n: true }
          - { label: Registries section heading, name: registries_heading, widget: string, i18n: true }
          - { label: Registries intro (markdown), name: registries_intro, widget: markdown, i18n: true }
          - label: Registries
            name: registries
            widget: list
            i18n: true
            fields:
              - { label: Registry name, name: name, widget: string, i18n: true }
              - { label: 'Section label (e.g. "ASX", "UK")', name: section_label, widget: string, required: false, i18n: true }
              - { label: Address (multi-line), name: address, widget: text, required: false, i18n: true }
              - { label: Email, name: email, widget: string, required: false, i18n: true }
              - { label: Website URL, name: website_url, widget: string, required: false, i18n: true }
              - { label: Website label, name: website_label, widget: string, required: false, i18n: true }
              - label: Phone blocks
                name: phones
                widget: list
                required: false
                fields:
                  - { label: 'Group label (optional, e.g. "Telephone enquiries")', name: label, widget: string, required: false, i18n: true }
                  - label: Numbers
                    name: numbers
                    widget: list
                    fields:
                      - { label: Region / note, name: label, widget: string, required: false, i18n: true }
                      - { label: Number, name: number, widget: string, i18n: true }
                    i18n: true
                i18n: true
          - { label: Receiving documents heading, name: receiving_heading, widget: string, i18n: true }
          - { label: Receiving documents body (markdown), name: receiving_body, widget: markdown, i18n: true }
          - { label: Shareholders' rights heading, name: rights_heading, widget: string, i18n: true }
          - { label: Shareholders' rights body (markdown), name: rights_body, widget: markdown, i18n: true }
          - { label: Contacts heading, name: contacts_heading, widget: string, i18n: true }
          - label: Contacts
            name: contacts
            widget: list
            i18n: true
            fields:
              - { label: Name, name: name, widget: string, i18n: true }
              - { label: Role, name: role, widget: string, i18n: true }
              - { label: Phone, name: phone, widget: string, required: false, i18n: true }
              - { label: Email, name: email, widget: string, required: false, i18n: true }
  - name: team
    label: Team
    folder: content/team
    create: true
    i18n: true
    slug: '{{slug}}'
    fields:
      - { label: Name, name: name, widget: string, i18n: true }
      - { label: Role, name: role, widget: string, i18n: true }
      - { label: Team section, name: team_section, widget: select, options: [ Board, Technical ], i18n: true }
      - { label: Photo, name: photo, widget: image, required: false, i18n: duplicate }
      - { label: Home credential (short line on the home leadership grid), name: home_credential, widget: text, required: false, i18n: true }
      - { label: Bio, name: bio, widget: text, i18n: true }
      - { label: Order, name: order, widget: number, value_type: int, i18n: true }
  - name: governance
    label: Governance
    folder: content/governance
    create: true
    i18n: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Category, name: category, widget: select, options: [ Constitution, Charters, Policies, Reports, Disclosures ], i18n: true }
      - { label: File, name: file, widget: file, i18n: true }
      - { label: Effective date, name: effective_date, widget: datetime, format: 'YYYY-MM-DD', time_format: false, date_format: 'YYYY-MM-DD', i18n: true }
      - { label: Description, name: description, widget: text, required: false, i18n: true }
  - name: projects
    label: Projects
    folder: content/projects
    create: true
    i18n: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string, i18n: true }
      - { label: Order (lower = higher up the projects list), name: order, widget: number, required: false, value_type: int, i18n: true }
      - { label: Commodity, name: commodity, widget: list, i18n: true }
      - { label: Status, name: status, widget: select, options: [ Active exploration, Drilling, Resource definition, Paused ], i18n: true }
      - { label: Region, name: region, widget: string, i18n: true }
      - { label: Latitude, name: lat, widget: number, value_type: float, i18n: true }
      - { label: Longitude, name: lng, widget: number, value_type: float, i18n: true }
      - { label: License area (km2), name: license_area_km2, widget: number, required: false, value_type: int, i18n: true }
      - { label: Acquired date, name: acquired_date, widget: datetime, required: false, format: 'YYYY-MM-DD', time_format: false, date_format: 'YYYY-MM-DD', i18n: true }
      - { label: Hero image, name: hero_image, widget: image, i18n: duplicate }
      - label: Gallery figures
        name: gallery_images
        widget: list
        required: false
        fields:
          - { label: Image, name: image, widget: image, i18n: duplicate }
          - { label: Caption, name: caption, widget: text, required: false, i18n: true }
        i18n: true
      - { label: Show "From the field" gallery on the project page, name: show_gallery, widget: boolean, required: false, default: false, i18n: duplicate }
      - { label: Gallery heading (leave blank for the default "From the field"), name: gallery_heading, widget: string, required: false, i18n: true }
      - label: From the field gallery (photos)
        name: gallery
        widget: list
        required: false
        hint: Field photos shown in the "From the field" carousel when the toggle above is on.
        fields:
          - { label: Image, name: image, widget: image, i18n: duplicate }
          - { label: Caption, name: caption, widget: text, required: false, i18n: true }
        i18n: true
      - { label: Summary, name: summary, widget: text, i18n: true }
      - { label: Tagline, name: tagline, widget: string, required: false, i18n: true }
      - { label: Flagship, name: is_flagship, widget: boolean, required: false, default: false, i18n: true }
      - { label: Group under "Other projects" (hidden from the main list), name: group_as_other, widget: boolean, required: false, default: false, i18n: true }
      - { label: Draft (pending Competent Person sign-off), name: is_draft, widget: boolean, required: false, default: false, i18n: true }
      - { label: Parent project slug, name: parent_project, widget: string, required: false, i18n: true }
      - label: Tenure
        name: tenure
        widget: object
        required: false
        fields:
          - { label: Licence, name: licence, widget: string, required: false, i18n: true }
          - { label: Licence type, name: licence_type, widget: string, required: false, i18n: true }
          - { label: Area (km2), name: area_km2, widget: number, required: false, value_type: float, i18n: true }
          - { label: Ownership, name: ownership, widget: string, required: false, i18n: true }
          - { label: Province, name: province, widget: string, required: false, i18n: true }
        i18n: true
      - label: Drill highlights
        name: drill_highlights
        widget: list
        required: false
        fields:
          - { label: Drillhole, name: hole, widget: string, i18n: true }
          - { label: Intercept, name: intercept, widget: text, i18n: true }
        i18n: true
      - label: Resource table
        name: resource_table
        widget: object
        required: false
        fields:
          - { label: Note, name: note, widget: string, required: false, i18n: true }
          - label: Rows
            name: rows
            widget: list
            fields:
              - { label: Category, name: category, widget: string, i18n: true }
              - { label: Tonnes, name: tonnes, widget: string, i18n: true }
              - { label: Grade, name: grade, widget: string, i18n: true }
              - { label: Contained, name: contained, widget: string, i18n: true }
            i18n: true
        i18n: true
      - label: Exploration target
        name: exploration_target
        widget: object
        required: false
        fields:
          - { label: Label, name: label, widget: string, i18n: true }
          - { label: Statement, name: statement, widget: text, i18n: true }
